name: Test notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ANUGA and notebook tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert ipykernel

      # A wheel built for a CPU this runner does not have kills the interpreter
      # with SIGILL and no traceback, which shows up as an unexplained core dump
      # halfway through a notebook. Fail here instead, with the diagnosis.
      - name: Verify anuga imports
        run: |
          status=0
          python -c "import anuga; print('anuga', anuga.__version__)" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::'import anuga' failed with exit code $status"
            if [ "$status" -eq 132 ]; then
              echo "Exit 132 is SIGILL: the installed anuga wheel uses CPU instructions this runner lacks."
              pkg=$(python -c "import importlib.util, pathlib; print(pathlib.Path(importlib.util.find_spec('anuga').origin).parent)")
              echo "ISA required per extension module (x86-64-v4 means AVX-512):"
              find "$pkg" -name '*.so' | while read -r so; do
                printf '  %s: ' "$(basename "$so")"
                readelf -n "$so" | sed -n 's/.*x86 ISA used: //p'
              done
              if grep -q avx512f /proc/cpuinfo; then
                echo "This runner has AVX-512, so the crash is something else."
              else
                echo "This runner has no AVX-512 — the wheel is unusable here."
              fi
            fi
            exit 1
          fi

      - name: Execute all notebooks
        run: bash notebooks/test_notebooks.sh

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: notebooks/*.nbconvert.ipynb
          if-no-files-found: ignore
